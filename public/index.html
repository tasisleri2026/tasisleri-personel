<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taş İşleri Personel ve Mesai Takip Programı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#1d2125;--muted:#6a6f76;--line:#e4dfd6;--acc:#0f5e63;--acc2:color-mix(in srgb,var(--acc) 12%,#fff);--warnbg:#fff6cc;--warnbd:#e8b900;--warnink:#5c4600;--ok:#1d7f46;--okbg:#dff3e6;--okbd:#5fb57f;--bad:#b3261e;--badbg:#fbe9e7;--mor:#6a2c91;--morbg:#efe3f8;--morbd:#a77bc9;--blu:#245ea8;--blubg:#e3edfa;--wk:#f1eee8;--hol:#fde6e1;--r:10px}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--ink);color:#fff;flex-wrap:wrap}
header .brand{font-weight:700;letter-spacing:.2px;font-size:15px}
header .sub{color:#aeb6bd;font-size:12px}
header .sp{flex:1}
.rolechip{font-size:12px;background:#2c3237;color:#d7dde2;border-radius:999px;padding:4px 10px;white-space:nowrap}
.hbtn{background:#2c3237;border:0;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
.hbtn.on{background:var(--warnbd);color:#1d2125;font-weight:700;animation:pulse 1.6s ease-in-out 3}
header select{background:#2c3237;color:#fff;border:0;border-radius:999px;padding:5px 10px;font-size:12px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(232,185,0,.35)}}
#shell{display:flex;flex:1;align-items:stretch;min-width:0}
#col{flex:1;min-width:0;display:flex;flex-direction:column}
nav{display:flex;flex-direction:column;gap:2px;width:236px;flex:0 0 236px;padding:14px 10px 20px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;z-index:30}
nav .ttl{font:600 10px ui-monospace,Menlo,monospace;letter-spacing:2px;color:#9a9690;padding:4px 12px 8px}
nav a{padding:10px 12px;border-radius:9px;color:#4a5056;text-decoration:none;white-space:nowrap;font-weight:500;display:flex;align-items:center;gap:10px}
nav .ttl{display:flex;align-items:center;justify-content:space-between}.nclose{display:none;border:0;background:#f1efeb;border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:14px}
@media(max-width:900px){.nclose{display:inline-block}}
nav a .ic{width:20px;text-align:center;font-size:15px;flex:0 0 20px}
nav a:hover{background:#f4f2ee}
.hmenu{display:none;background:#2c3237;color:#fff;border:0;border-radius:9px;width:38px;height:38px;font-size:19px;cursor:pointer;align-items:center;justify-content:center}
.hhome{display:flex;align-items:center;gap:12px;cursor:pointer;color:inherit;text-decoration:none}
#navbg{display:none}
@media(max-width:900px){.hmenu{display:inline-flex}nav{position:fixed;left:0;top:0;bottom:0;height:100%;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 30px rgba(0,0,0,.25)}body.navopen nav{transform:none}body.navopen #navbg{display:block;position:fixed;inset:0;background:rgba(10,12,14,.4);z-index:25}}
nav a.act{background:var(--acc2);color:var(--acc)}
nav a .cnt{background:var(--warnbd);color:#1d2125;border-radius:999px;padding:0 7px;font-size:11px;margin-left:5px;font-weight:700}
#status{max-width:1400px;width:100%;margin:10px auto 0;padding:0 18px}
main{padding:18px;max-width:1400px;width:100%;margin:0 auto;flex:1}
footer{text-align:center;font-size:11px;color:#9a9690;opacity:.55;padding:18px 10px 22px;letter-spacing:.2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 10px}
h4{font-size:13px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px}
.kpi.warn{background:var(--warnbg);border-color:var(--warnbd)}
.kpi.mor{background:var(--morbg);border-color:var(--morbd)}
.kpi.ok{background:var(--okbg);border-color:var(--okbd)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:#b9b0a2}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.w{background:var(--warnbd);border-color:var(--warnbd);color:#1d2125;font-weight:600}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.m{background:var(--mor);border-color:var(--mor);color:#fff}
.btn.d{color:var(--bad)}
.btn.s{padding:4px 9px;font-size:12px}
.btn.big{padding:14px 18px;font-size:16px;font-weight:600;flex:1;min-width:140px}
.btn[disabled]{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);max-width:100%}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc);vertical-align:middle}
input[type=color]{padding:2px;height:36px;width:60px}
textarea{width:100%;min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f input,label.f select,label.f textarea{color:var(--ink);font-size:14px;width:100%}
label.cb{display:flex;gap:8px;align-items:center;font-size:14px}
.fg{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.fg .wide{grid-column:1/-1}
table.t{width:100%;border-collapse:collapse}
.t th,.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t th{font-size:12px;color:var(--muted);font-weight:600;background:#faf8f5;white-space:nowrap}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.t tfoot td{font-weight:700;background:#faf8f5}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:#faf8f5}
.t td input,.t td select,.t td textarea{padding:4px 6px}
.t tr.grp td{background:#f3f0ea;font-weight:700;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.scroll{overflow:auto;max-width:100%}
.sticky{max-height:76vh}
.sticky .t thead th{position:sticky;top:0;z-index:3;box-shadow:0 1px 0 var(--line)}
.sticky .t tfoot td{position:sticky;bottom:0;z-index:2}
.sticky .t td:first-child{min-width:170px}
.sticky .t th{white-space:normal;min-width:64px;vertical-align:bottom}
.warn{background:var(--warnbg) !important;border-color:var(--warnbd) !important;color:var(--warnink)}
.alert{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;background:#fff}
.alert.red{background:var(--badbg);border-color:#e9a59f;color:var(--bad)}
.alert.okk{background:var(--okbg);border-color:var(--okbd);color:#145c33}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.y{background:var(--warnbg);color:var(--warnink);border:1px solid var(--warnbd)}
.chip.g{background:var(--okbg);color:var(--ok)}
.chip.r{background:var(--badbg);color:var(--bad)}
.chip.n{background:#eeebe5;color:#555}
.chip.b{background:var(--acc2);color:var(--acc)}
.chip.m{background:var(--morbg);color:var(--mor);border:1px solid var(--morbd)}
.chip.bl{background:var(--blubg);color:var(--blu)}
.muted{color:var(--muted)}
.small{font-size:12px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.item.warn{border-color:var(--warnbd)}
.item.red{border-color:#e9a59f;background:var(--badbg)}
.item .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
/* yoklama durum hücreleri */
.st{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:8px;font-weight:600;font-size:13px;border:1px solid transparent;white-space:nowrap;font-variant-numeric:tabular-nums}
.st-y{background:var(--warnbg);border-color:var(--warnbd);color:var(--warnink)}
.st-g{background:var(--okbg);border-color:var(--okbd);color:#145c33}
.st-m{background:var(--morbg);border-color:var(--morbd);color:var(--mor)}
.st-b{background:var(--blubg);border-color:#9dbbe4;color:var(--blu)}
.st-n{background:#f3f1ec;color:#8a8780}
.st small{font-weight:500;opacity:.8}
tr.rw-m td{background:#faf5fd}
tr.rw-y td{background:#fffcec}
tr.rw-g td{background:#f6fbf7}
.pt{border-collapse:separate;border-spacing:0;font-size:12px}
.pt th,.pt td{border-bottom:1px solid var(--line);border-right:1px solid #efebe4;padding:5px 2px;text-align:center;min-width:28px;white-space:nowrap}
.pt th{background:#faf8f5;position:sticky;top:0;z-index:2;font-weight:600;color:var(--muted);line-height:1.15}
.pt .nm{position:sticky;left:0;background:#fff;text-align:left;min-width:160px;padding:5px 8px;z-index:1;font-weight:500}
.pt th.nm{z-index:3;background:#faf8f5}
.pt td.tot,.pt th.tot{background:#faf8f5;font-variant-numeric:tabular-nums;padding:5px 6px}
.pt td.wk,.pt th.wk{background:var(--wk)}
.pt td.hol,.pt th.hol{background:var(--hol)}
.pt td.cell{cursor:pointer}
.pt td.cell:hover{outline:2px solid var(--acc);outline-offset:-2px}
.c-C{color:var(--ok);font-weight:700}
.c-M{background:#ffeea6 !important;font-weight:700;color:#5c4600}
.c-I{color:#2b5fa8;font-weight:600}
.c-D{color:var(--bad);font-weight:700}
.c-out{background:repeating-linear-gradient(45deg,#f2efea,#f2efea 4px,#fff 4px,#fff 8px) !important;cursor:default !important}
.legend{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.9}
.legend b{display:inline-block;min-width:22px;text-align:center;border-radius:4px;margin-right:4px}
.legend span{margin-right:14px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(20,22,25,.45);display:flex;align-items:flex-start;justify-content:center;padding:36px 12px;z-index:50;overflow:auto}
.modal.hidden{display:none}
.mbox{background:#fff;border-radius:14px;max-width:680px;width:100%;padding:18px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mfoot .sp{flex:1}
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:calc(100vw - 28px)}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;max-width:360px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px}
.toast.y{background:var(--warnbg);color:var(--warnink);border:2px solid var(--warnbd);font-weight:600}
.toast.e{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.tabs button{border:0;background:#fff;padding:7px 12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--acc);color:#fff}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.guide h3{margin-top:18px}
.guide p,.guide li{line-height:1.65}
.guide ul,.guide ol{padding-left:20px;margin:6px 0}
.preview{background:#2b5fa8;color:#fff;text-align:center;font-size:12px;padding:5px}
.preview button{background:#fff;color:#2b5fa8;border:0;border-radius:6px;padding:2px 8px;margin-left:8px;cursor:pointer;font:inherit;font-size:12px}
.pw{font:600 22px/1.2 ui-monospace,Menlo,monospace;letter-spacing:2px;background:#f3f1ec;border-radius:8px;padding:10px 14px;display:inline-block}

/* giriş */
body.login header,body.login nav,body.login #pv{display:none}
body.login main{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 70px);max-width:none}
.lg{display:grid;grid-template-columns:1.05fr 1fr;max-width:960px;width:100%;border-radius:22px;overflow:hidden;box-shadow:0 34px 70px -28px rgba(0,0,0,.45);background:#fff}
.lg-l{position:relative;background:#111214;color:#fff;padding:40px 40px 30px;display:flex;flex-direction:column;gap:14px;min-height:540px;overflow:hidden}
.lg-l svg.v{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.lg-l>*:not(svg){position:relative}
.lg-brand{display:flex;align-items:center;gap:14px}
.lg-logo{width:86px;height:86px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.6);display:block}
.lg-brand small{font:600 11px ui-monospace,Menlo,monospace;letter-spacing:3px;color:#c9ccd1}
.lg-h{font-size:42px;line-height:1.02;font-weight:800;letter-spacing:-.6px;margin:auto 0 0}
.lg-h em{font-style:normal;color:#f2a51a}
.lg-sub{font-size:14px;color:#f2a51a;letter-spacing:.4px;margin-top:-4px}
.lg-p{color:#b6bac1;font-size:14px;line-height:1.65;max-width:380px;margin:4px 0 0}
.lg-f{margin-top:22px;font:11px ui-monospace,Menlo,monospace;letter-spacing:2px;color:#7f838a}
.lg-r{padding:44px 42px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.lg-r h2{font-size:28px;margin:0}
.lg-r .muted{margin:0 0 14px}
.lg-lbl{font-size:12px;font-weight:600;color:#3d4248;margin:10px 0 6px}
.lg-in{position:relative}
.lg-in input{width:100%;padding:13px 44px 13px 14px;font-size:15px;background:#eef2fb;border:1px solid #dde3ef;border-radius:10px}
.lg-in input:focus{outline:2px solid #f2a51a;background:#fff}
.lg-eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;padding:6px;color:#6a6f76}
.lg-btn{width:100%;padding:14px;border:0;border-radius:10px;background:#f2a51a;color:#141414;font-weight:800;font-size:15px;cursor:pointer;margin-top:16px;letter-spacing:.2px}
.lg-btn:hover{background:#e39608}
.lg-note{font-size:12px;color:#7a7f86;margin-top:14px}
.lg-alt{margin-top:22px;border-top:1px solid #eceae6;padding-top:14px;font-size:13px}
.lg-alt a{color:#6a6f76;cursor:pointer}
@media(max-width:780px){.lg{grid-template-columns:1fr}.lg-l{min-height:auto;padding:26px}.lg-h{font-size:32px;margin-top:26px}.lg-r{padding:26px}}
header .hlogo{width:34px;height:34px;border-radius:7px;display:block}
/* karşılama */
.hero{position:relative;border-radius:16px 16px 0 0;overflow:hidden;color:#fff;min-height:200px;margin-bottom:0;display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:end;padding:22px 26px 24px}
.hero .glass{justify-self:end}
.hero svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero>div{position:relative;z-index:1}
.hero .dt{font-size:12px;opacity:.92;display:flex;gap:10px;align-items:center;position:absolute;top:22px;left:26px;z-index:1}
.hero .wk{border:1px solid rgba(255,255,255,.65);border-radius:6px;padding:1px 7px;font:600 10px ui-monospace,Menlo,monospace;letter-spacing:1.5px}
.hero .gr{font-size:21px;opacity:.95;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.hero .nm{font-size:42px;font-weight:800;letter-spacing:-.6px;line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.glass{background:rgba(18,22,40,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:12px 14px;min-width:340px}
.glass .w{display:flex;align-items:center;gap:10px}
.glass .t{font-size:24px;font-weight:700}
.glass .sm{font-size:12px;opacity:.88}
.kur{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:rgba(0,0,0,.28);border-radius:10px;padding:8px 10px;margin-top:10px}
.kur .k{font:600 10px ui-monospace,Menlo,monospace;letter-spacing:1px;opacity:.8}
.kur .v{font:700 16px ui-monospace,Menlo,monospace;margin-top:2px}
.glass .src{font:10px ui-monospace,Menlo,monospace;letter-spacing:1px;opacity:.72;margin-top:8px}
.clock{text-align:center;align-self:center;padding-top:18px}
.clock .c{font:700 32px/1 Inter,system-ui;letter-spacing:-1px;font-variant-numeric:tabular-nums;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.clock .c small{font-size:13px;opacity:.7;font-weight:600;margin-left:4px}
.clock .z{font-size:12px;opacity:.85;margin-top:4px}
@media(max-width:980px){.hero{grid-template-columns:1fr;padding-top:52px}.hero .glass{justify-self:stretch}.glass{min-width:0}.clock{text-align:center;order:-1;padding-top:0}.hero .nm{font-size:34px}}
.tick{display:flex;align-items:center;background:#15181c;color:#e9ecef;border-radius:0 0 16px 16px;margin-bottom:16px;overflow:hidden;height:38px;font-size:13px}
.tick .lb{flex:0 0 auto;background:#f2a51a;color:#141414;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:1.5px;padding:0 12px;height:100%;display:flex;align-items:center;gap:6px;z-index:1}
.tick .vp{flex:1;overflow:hidden;white-space:nowrap;position:relative;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.tick .run{display:inline-block;will-change:transform;padding-left:12px}
.tick .run span{margin-right:38px}
.tick .run b{color:#fff}
.tick .tz{flex:0 0 auto;font:10px ui-monospace,Menlo,monospace;letter-spacing:1px;opacity:.6;padding:0 12px}
.tick .run i{font-style:normal}
.tick .r3{color:#ff6b5b}.tick .r2{color:#ffb547}.tick .r1{color:#f5df6b}.tick .r0{color:#7ed39a}
@media(max-width:700px){.tick .tz{display:none}}
/* duyurular */
.du{border:1px solid var(--line);border-left:4px solid #9aa0a6;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.du.t-uyari{border-left-color:var(--bad)}.du.t-isg{border-left-color:var(--warnbd)}.du.t-plan{border-left-color:var(--blu)}.du.t-kutlama{border-left-color:var(--ok)}
.du .h{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.du .b{white-space:pre-wrap;margin-top:4px;font-size:14px}
.du .m{font-size:11px;color:var(--muted);margin-top:6px}
@media (max-width:700px){main{padding:10px}#status{padding:0 10px}.card{padding:12px}header{padding:10px 12px}.hide-m{display:none}.kpi .v{font-size:18px}}
</style>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><meta name="theme-color" content="#1f2a36"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><script src="/cf.js"></script></head>
<body>

const SHA=(()=>{const K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
 const r=(x,n)=>(x>>>n)|(x<<(32-n));
 function h(m){const l=m.length,bl=((l+9+63)>>6)<<6,b=new Uint8Array(bl);b.set(m);b[l]=0x80;const dv=new DataView(b.buffer);dv.setUint32(bl-4,l*8);
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const w=new Uint32Array(64);
  for(let i=0;i<bl;i+=64){for(let t=0;t<16;t++)w[t]=dv.getUint32(i+t*4);for(let t=16;t<64;t++){const a=w[t-15],c=w[t-2];w[t]=(w[t-16]+(r(a,7)^r(a,18)^(a>>>3))+w[t-7]+(r(c,17)^r(c,19)^(c>>>10)))|0}
   let[a,bb,c,d,e,f,g,hh]=H;for(let t=0;t<64;t++){const t1=(hh+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[t]+w[t])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&c)^(bb&c)))|0;hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
   H=[(H[0]+a)|0,(H[1]+bb)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+hh)|0]}
  const o=new Uint8Array(32);const ov=new DataView(o.buffer);H.forEach((v,i)=>ov.setUint32(i*4,v>>>0));return o}
 const hex=u=>Array.from(u,x=>x.toString(16).padStart(2,'0')).join('');
 return{hex:s=>hex(h(new TextEncoder().encode(s))),pw:(pw,salt)=>{const e=new TextEncoder();const sb=e.encode(salt);let x=h(e.encode(salt+':'+pw));for(let i=0;i<3000;i++){const m=new Uint8Array(x.length+sb.length);m.set(x);m.set(sb,x.length);x=h(m)}return hex(x)}}})();

function holidays(){
 if(S._holSrc!==S.ayar.tatiller){S._holSrc=S.ayar.tatiller;S._hol={};
  String(S.ayar.tatiller||'').split('\n').forEach(l=>{const m=l.trim().match(/^(\d{4}-\d{2}-\d{2})\s*(.*)$/);if(m)S._hol[m[1]]=m[2]||'Resmi tatil'})}
 return S._hol}
function kindOf(ds){if(holidays()[ds])return'rt';const w=pd(ds).getDay();return w===6?'cmt':w===0?'pzr':'hi'}
function kindLabel(ds){const k=kindOf(ds);return k==='rt'?'Resmi tatil ('+holidays()[ds]+')':k==='cmt'?'Cumartesi':k==='pzr'?'Pazar':'Hafta içi'}
function rates(id){const u=S.ucret[id]||{},a=S.ayar;const cmt=num(u.cmt,num(a.cmt,5000));
 return{cmt,pzr:num(u.pzr,num(a.pzr,8000)),tatil:num(u.tatil,num(a.tatil,8000)),yemek:num(u.yemek,num(a.yemek,2500)),saat:num(u.saat,num(a.saat,Math.round(cmt/num(a.gunSaat,10.5))))}}
function ekAuto(r){if(!r||!r.c)return 0;let m=toMin(r.c);const g=toMin(r.g);if(g!=null&&m<g)m+=1440;const o=(m-toMin(S.ayar.bitis||'20:00'))/60;return o>0?Math.floor(o*2)/2:0}
function ekSaat(r){if(!r)return 0;if(r.ek!==undefined&&r.ek!==null&&r.ek!=='')return +r.ek||0;return ekAuto(r)}
function getDay(id,ds){return((S.kayit[id+'__'+ymOf(ds)]||{}).gunler||{})[ds.slice(8)]||null}
function dayCalc(id,ds,r,R){const o={hi:0,cmt:0,pzr:0,rt:0,ek:0,yemek:0,tl:0};if(!r)return o;R=R||rates(id);
 const k=kindOf(ds);const w=r.d==='C'?1:r.d==='Y'?0.5:0;
 if(w){if(k==='hi'){o.hi=w;o.ek=ekSaat(r)}else o[k]=w}
 if(r.y)o.yemek=1;
 o.tl=o.cmt*R.cmt+o.pzr*R.pzr+o.rt*R.tatil+o.ek*R.saat+o.yemek*R.yemek;return o}
function calcRange(id,from,to){const R=rates(id);const s={hi:0,cmt:0,pzr:0,rt:0,ek:0,yemek:0,mesaiTL:0,izin:{YI:0,UI:0,RP:0,MI:0,DV:0},rows:[],R};
 let ym=ymOf(from);const end=ymOf(to);let guard=0;
 while(ym<=end&&guard++<400){const g=(S.kayit[id+'__'+ym]||{}).gunler||{};
  for(const dd of Object.keys(g).sort()){const ds=ym+'-'+dd;if(ds<from||ds>to)continue;const r=g[dd];const c=dayCalc(id,ds,r,R);
   ['hi','cmt','pzr','rt','ek','yemek'].forEach(k=>s[k]+=c[k]);s.mesaiTL+=c.tl;if(r&&s.izin[r.d]!=null)s.izin[r.d]++;s.rows.push({ds,r,c})}
  ym=addMonth(ym,1)}
 return s}
function calcMonth(id,ym){const[a,b]=monthRange(ym);return calcRange(id,a,b)}
function firstYm(){let m=ymOf(today());for(const k of Object.keys(S.kayit)){const y=k.split('__')[1];if(y&&y<m)m=y}for(const h of Object.values(S.hareket)){if(h.tarih&&ymOf(h.tarih)<m)m=ymOf(h.tarih)}return m}
function ledger(id,from,to){const o={avans:0,odeme:0,kesinti:0,devir:0,prim:0,list:[]};
 for(const[hid,h]of Object.entries(S.hareket)){if(h.empId!==id)continue;if(from&&h.tarih<from)continue;if(to&&h.tarih>to)continue;o[h.tur]=(o[h.tur]||0)+(+h.tutar||0);o.list.push({id:hid,...h})}
 o.list.sort((a,b)=>a.tarih<b.tarih?1:a.tarih>b.tarih?-1:0);o.arti=o.devir+o.prim;o.eksi=o.avans+o.odeme+o.kesinti;return o}
function hesap(id,from,to){const c=calcRange(id,from,to),l=ledger(id,from,to);const hak=c.mesaiTL+l.arti;const odenecek=hak-l.eksi;
 const all=calcRange(id,firstYm()+'-01',to).mesaiTL;const la=ledger(id,null,to);return{c,l,hak,odenecek,bakiye:all+la.arti-la.eksi}}
function ayHesap(id,ym){const c=calcMonth(id,ym);const[a,b]=monthRange(ym);const l=ledger(id,a,b);return{c,l,hak:c.mesaiTL+l.arti,net:c.mesaiTL+l.arti-l.eksi}}

const mesaiTick=(id,ym)=>{const t=odDoc(id,ym).mesai;return t&&t.ok?t:null};
function laterTick(id,ym){let best=null;for(const v of Object.values(S.odeme)){if(v.empId===id&&v.ay>ym&&v.mesai&&v.mesai.ok&&(!best||v.ay<best))best=v.ay}return best}
function mesaiPaid(id,ym){return!!mesaiTick(id,ym)||!!laterTick(id,ym)}
const maasPaid=(id,ym)=>!!(odDoc(id,ym).maas&&odDoc(id,ym).maas.ok);
/* aylık cari hesap: her ay = önceki aydan kalan + ayın neti; tik atılan ayda ödenen düşülür, kalan sonraki aya devreder */
function seri(id,upto){const o={};let m=firstYm(),bal=0,g=0;if(upto<m)m=upto;while(m<=upto&&g++<240){const h=ayHesap(id,m);const t=mesaiTick(id,m);const toplam=bal+h.net;const odenen=t?(t.tutar!=null?+t.tutar:toplam):0;o[m]={bas:bal,h,toplam,odenen,kalan:toplam-odenen,tick:t};bal=toplam-odenen;m=addMonth(m,1)}return o}
function devirOf(id,ym){const sr=seri(id,ym);const ms=Object.keys(sr).filter(m=>m<ym).sort();let p=null;ms.forEach(m=>{if(sr[m].tick)p=m});
 const o={onceKalan:p?sr[p].kalan:0,onceAy:p,mes:0,av:0,aylar:[]};
 ms.filter(m=>!p||m>p).forEach(m=>{const h=sr[m].h;const hm=h.hak-h.l.odeme-h.l.kesinti;if(Math.abs(hm)>0.001||h.l.avans){o.mes+=hm;o.av+=h.l.avans;o.aylar.push({ym:m,mesai:hm,avans:h.l.avans})}});
 o.mes+=o.onceKalan;return o}
function ayOzet(id,ym){const h=ayHesap(id,ym),dv=devirOf(id,ym);const x=seri(id,ym)[ym]||{toplam:dv.mes-dv.av+h.net,odenen:0,kalan:dv.mes-dv.av+h.net,tick:null};return{...h,dv,odenecek:x.toplam,odenen:x.odenen,kalan:x.kalan,tick:x.tick}}
function uyarilar(id,ym){const out=[];const bas=S.ayar.odemeTakipBas;const u=S.ucret[id]||{};
 if(bas&&u.brut){let m=bas,g=0;while(m<ym&&g++<120){const[a,b]=monthRange(m);if(activeIn(id,a,b)&&!maasPaid(id,m))out.push({t:'maas',ym:m,txt:ymLabel(m)+' maaşı yatmadı'});m=addMonth(m,1)}}
 const dv=devirOf(id,ym);if(mesaiTick(id,ym))return out;if(Math.abs(dv.onceKalan)>0.001)out.push({t:'kalan',ym:dv.onceAy,txt:ymLabel(dv.onceAy)+' ödemesinden kalan '+tl(dv.onceKalan)});dv.aylar.forEach(x=>{const n=x.mesai-x.avans;if(Math.abs(n)>0.001)out.push({t:'mesai',ym:x.ym,txt:ymLabel(x.ym)+' mesaisi ödenmedi ('+tl(n)+')'})});return out}

function tickHtml(id,ym,k){const d=odDoc(id,ym)[k];const own=!!(d&&d.ok);const paid=k==='mesai'?mesaiPaid(id,ym):own;const via=paid&&!own;

function logEvt(tur,empId,metin){if(S.gz||!S.db)return;if(S.realRole!=='yonetici'&&!(S.realRole==='gozlem'&&(yetki('maasOde')||yetki('bordro'))))return;const ts=Date.now();const id=ts+'-'+rid().slice(-5);const d={ts,tur,empId:empId||'',metin:String(metin||''),ad:actorName()};S.log[id]=d;put('islemlog/'+id,d).catch(()=>{})}
function netTahmin(id){const u=S.ucret[id]||{};if(u.netManuel)return +u.netManuel;const b=+u.brut||0;if(!b)return 0;const A=+S.ayar.asgariBrut||33030;const gv=+(u.gv||15);
 const sgk=b*0.15;const gvT=Math.max(0,(b-sgk)*gv/100-A*0.85*0.15);const damga=Math.max(0,(b-A)*0.00759);return Math.round((b-sgk-gvT-damga)*100)/100}

function sgkGun(id,ym){const[a,b]=monthRange(ym);const p=P(id);if(!activeIn(id,a,b))return{gun:0,takvim:0,eksik:0,det:{UI:0,DV:0,RP:0}};
 const s1=p.giris&&p.giris>a?p.giris:a,e1=p.cikis&&p.cikis<b?p.cikis:b;const tam=s1===a&&e1===b;const takvim=tam?30:Math.min(30,dayDiff(s1,e1)+1);

let rq=false;
function isEditing(){const a=document.activeElement;if(!a||!$('#main').contains(a))return false;return a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','button','color','date','month','time'].includes(a.type))}
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;if(isEditing()||!$('#modal').classList.contains('hidden')){S.deferred=true;drawHeader();return}draw()})}
function visibleTabs(){const r=S.role;if(!r)return[];const base=ROLE_TABS[r].filter(t=>(t!=='maas'||yetki('maasOde'))&&(t!=='bordro'||yetki('bordro')));const cfg=(S.ayar.gorunum.tabs||{})[r];return base.filter(t=>FORCED[r].includes(t)||t==='kilavuz'||!cfg||cfg.includes(t))}
function alertCount(){if(!S.role)return 0;let n=0;const ds=today();
 if(isY()){Object.values(S.yok).forEach(doc=>Object.entries(doc.gunler||{}).forEach(([dd,d])=>{if(doc.ay+'-'+dd<=ds)n+=pendingParts(doc.empId,doc.ay+'-'+dd,d).length}));n+=Object.values(S.talep).filter(t=>t.durum==='bekliyor').length+pendingClaims().length}
 else if(isU()){ekip(meId()).forEach(id=>n+=pendingParts(id,ds).filter(p=>p!=='izin').length);n+=ynotBekleyen(meId()).length}
 return n}

 const g=S.ayar.gorunum||{};$('#hsub').textContent=S.ayar.firma||'';
 let h='';const n=alertCount();
 if(S.role){document.title=(n?'('+n+') ':'')+(g.ad||PROG);

function ridge(y,amp,seed,step){let d='M0 300 L0 '+y;for(let x=0;x<=1600;x+=step){const v=Math.sin(x/170+seed)*amp+Math.sin(x/63+seed*2.3)*amp*.35+Math.sin(x/29+seed*5.1)*amp*.12;d+=' L'+x+' '+(y-v).toFixed(1)}return d+' L1600 300 Z'}
function skySvg(){const d=new Date(),h=d.getHours()+d.getMinutes()/60;const k=(SKY.find(x=>h>=x[0]&&h<x[1])||SKY[0])[2];const p=PAL[k];
 let o='<svg class="bg" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+p.s[0]+'"/><stop offset=".55" stop-color="'+p.s[1]+'"/><stop offset="1" stop-color="'+p.s[2]+'"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="'+(p.sun||'#fff')+'" stop-opacity=".9"/><stop offset="1" stop-color="'+(p.sun||'#fff')+'" stop-opacity="0"/></radialGradient><linearGradient id="mist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".14"/></linearGradient></defs><rect width="1600" height="300" fill="url(#sk)"/>';

V.kilavuz=()=>{const r=S.role;const sec=(roles,html)=>roles.includes(r)?html:'';
 return'<div class="card guide"><h2>Kullanım kılavuzu</h2><p>'+esc(S.ayar.gorunum.ad||PROG)+' — personelin giriş-çıkış, mesai, izin ve haftalık iş planlamasını tek yerden takip eder. Aşağıda rolünüze göre yapmanız gerekenler var.</p>'+
 '<h3>Giriş, şifre ve menü</h3><ul><li><b>Kullanıcı adı:</b> adınızın baş harfi, nokta, soyadınız — ör. <b>k.gültekin</b>. Türkçe harf yerine düz harf de yazabilirsiniz (k.gultekin).</li><li><b>Şifre:</b> ilk şifreyi yöneticiniz verir. Girişten sonra sağ üstteki 🔑 düğmesiyle kendi şifrenizi belirleyin (en az 6 karakter). Unutursanız yöneticiniz size yeni şifre oluşturur.</li><li>Kullanıcı adı açma ve şifre oluşturma yetkisi <b>Genel Müdür</b> ve <b>Satış ve Planlama Yöneticisi</b>ndedir.</li><li><b>Menü</b> sol taraftadır; telefonda sol üstteki <b>☰</b> ile açılır. Sol üstteki <b>logoya</b> basınca ana sayfaya (Panel / Bugün) dönersiniz.</li><li>Ana sayfadaki bilgi kutusunun altındaki <b>trafik şeridi</b> Kartal çevresi 20 km için yoğunluk, kaza ve kapalı yol bilgisini gösterir; 15 dakikada bir yenilenir. Hava ve kur saat başı yenilenir.</li><li>Ortak cihazda iş bitince <b>Çıkış yap</b>’a basın.</li></ul>'+
 '<h3>Kişisel bilgiler ve doğum günleri</h3><ul><li>Kimlik no, uyruk, doğum tarihi ve ev adresini yalnız <b>Genel Müdür</b> ve <b>Satış ve Planlama Yöneticisi</b> girer ve görür (Personel → kişi → Kişisel bilgiler). TC numarası kontrol hanesiyle doğrulanır.</li><li>Bir çalışanın doğum günü geldiğinde yöneticilerin ana sayfasında <b>sarı</b> uyarı çıkar; duyurularda herkese otomatik olarak “Kıymetli çalışanımız … doğum gününü kutlar, sağlıklı ve başarılı nice mutlu yaşlar dileriz.” mesajı yayınlanır.</li></ul>'+
 '<h3>Planlama ve yönetici notları</h3><ul><li>Planlama sayfası ayrı bölümlerden oluşur: <b>Hafta başı planı</b>, <b>Hafta sonu planı</b>, <b>Yönetici notları</b>, <b>Talepler</b>, <b>Günlük notlar</b>.</li><li>Yönetici, usta başının planından önce ya da sonra <b>Yönetici notları</b>na not yazabilir. Notu yalnız usta başı ve yöneticiler görür.</li><li>Not yazılınca usta başının ekranına anında <b>sarı</b> uyarı düşer. Usta başı <b>Okudum</b>’a basınca sarı kalkar; yöneticinin duyurular bölümünde “notu okudu” bilgisi görünür.</li><li>Notun yazılması ve okunması tarih ve saatiyle <b>Yapılan işlemler</b>e kaydedilir.</li></ul>'+
 '<h3>Renkler ne anlatır?</h3><ul><li><span class="st st-y">Sarı</span> — kayıt girildi, usta başı veya yönetici onayı bekliyor.</li><li><span class="st st-g">Yeşil</span> — usta başı / yönetici onayladı; saatler kesinleşti.</li><li><span class="st st-m">Mor</span> — kişi o gün gelmedi (işaretlendi ya da mesai başlangıcından '+num(S.ayar.gelmediDk,60)+' dk sonra hâlâ giriş yok).</li><li><span class="st st-b">Mavi</span> — onaylı izinli.</li><li><span class="st st-n">Gri</span> — henüz kayıt yok.</li></ul><p>Renkler <b>her gün sıfırlanır</b>: dün gelmeyen veya geç gelen kişi bugün normal (gri) başlar. '+esc(S.ayar.baslangic)+' + '+num(S.ayar.gecDk,15)+' dk sonrası girişler “geç” etiketi alır.</p>'+
 sec(['calisan','ustabasi','yonetici'],'<h3>İşçi</h3><ol><li><b>Giriş yaptım</b> — işe gelince basın (saat otomatik gelir, değiştirebilirsiniz).</li><li><b>Yaptığım iş</b> — gün içinde ya da çıkışta hangi blok/dairede ne iş yaptığınızı seçin.</li><li><b>Çıkış yaptım</b> — iş bitince basın. Çıkış '+esc(S.ayar.bitis)+' sonrasıysa <b>Mesai bildir</b> ile ek saati ve yemeği yazın.</li><li><b>İzin iste</b> — izin gününü, türünü ve nedenini yazın; usta başınız ve yöneticiniz görür.</li><li>“Günün iş planı” ve “Bu hafta bana planlanan işler” kartlarını her sabah okuyun.</li><li>Girdiğiniz her kayıt önce <b>sarı</b> görünür; usta başınız onaylayınca <b>yeşil</b> olur.</li></ol>')+
 sec(['ustabasi','yonetici'],'<h3>Usta başı</h3><p><b>Her gün</b></p><ol><li>Sabah ekibin girişlerini kontrol edin: çalışanın girdiği kayıtları <b>✓ Onayla</b>; girmeyenler için <b>Giriş</b> düğmesiyle siz girin (sizin girdiğiniz otomatik onaylıdır). Gelmeyeni <b>Gelmedi</b> ile işaretleyin.</li><li><b>Günlük iş notu</b> yazın: bugün ekip nerede, ne yapacak, hangi araç ve malzeme gerekli. Kişiye özel işleri “kişi bazlı notlar”a yazın. Not yöneticinize anında düşer.</li><li>Akşam çıkışları ve mesaileri onaylayın. İzin taleplerini “İzne uygun” ile yöneticiye iletin (son onay yöneticidedir).</li></ol><p><b>Her hafta</b></p><ol><li><b>Hafta başı planı</b> — en geç Pazartesi '+esc(S.ayar.planBasSaat)+', tercihen önceki Cumartesi. Her iş için gün, gidilecek yer, yapılacak iş, kişi sayısı ve kimler, gerekli <b>alet-edevat</b>, malzeme ve araç.</li><li><b>Hafta sonu değerlendirmesi</b> — en geç Cumartesi '+esc(S.ayar.planSonSaat)+': tamamlananlar, yapılamayanlar ve nedeni, gelecek haftanın ihtiyaçları, kişi bazlı durumlar.</li><li><b>Talepler</b> — alet, malzeme, araç, ek eleman ihtiyaçlarını ihtiyaç tarihinden en az <b>'+num(S.ayar.talepMinGun,2)+' gün</b> önce girin. <b>Son güne talep bırakılmaz</b>; daha geç girilen talep “son dakika” olarak kırmızı düşer ve gerekçe ister.</li></ol><p><b>Montaja çıkmadan önce kontrol listesi (örnek):</b> lazer metre/şerit metre, su terazisi, spiral taşlama + elmas kesme diski, su soğutmalı kesim seti, elmas panç (eviye/batarya deliği), matkap, polisaj makinesi ve keçeler, taş vantuzu, işkence/kıskaç, takoz ve kama, silikon tabancası + silikon, epoksi/mastik yapıştırıcı, temizlik malzemesi, taşıma arabası/sehpa, uzatma kablosu, KKD (gözlük, eldiven, kulaklık, toz maskesi, iş ayakkabısı), araç ve yeterli kişi sayısı.</p>')+
 sec(['yonetici'],'<h3>Yönetici</h3><ol><li><b>Panel</b>: günün giriş-çıkış tablosu ekip ekip görünür. Usta başının onayladıkları yeşil olur; “Puantaja aktar” ile mesai hesabına işlenir. Sizin onayladığınız kayıt doğrudan puantaja geçer.</li><li>İzin taleplerini ve talepleri onaylayın/reddedin; son dakika talepler kırmızıdır.</li><li><b>Aylık puantaj / Günlük kayıt</b>: puantajı doğrudan düzeltebilirsiniz. <b>Mesai hesabı</b>: Cumartesi, Pazar, resmi tatil, ek saat ve yemek ücretleri, avanslar düşülerek hesaplanır; Excel’e toplu ya da kişi bazında alınır.</li><li><b>İşten çıkış</b> ve <b>Sistemden çıkar</b>: tarih, neden, açıklama ve işlemi yapan doldurulmadan işlem yapılamaz. Ayrılanlar ayrı sekmede listelenir.</li><li><b>Yönetim</b>: kullanıcı adı/şifre açma, rol (işçi / usta başı / yönetici) ve ekip atama, sayfa düzeni (program adı, renk, hangi rol hangi sekmeleri görür), ücret oranları ve kurallar.</li><li><b>Ödeme takibi</b>: Personel ve Mesai hesabı ekranlarında her kişi ve ay için ayrı <b>Maaş</b> ve <b>Mesai</b> tiki vardır; muhasebeden gelen bilgiye göre işaretleyin. Mesai tiki o ayı ve önceki ödenmemiş ayları kapatır. Tik kaldırılırken “Emin misiniz?” sorulur; her işlem <b>Yapılan işlemler</b> sekmesine tarih-saat ve kişi adıyla yazılır. Önceki aylardan ödenmemiş maaş/mesai ve avanslar o ayda sarı ⚠ ile ayrı satır olarak görünür.</li><li><b>Hafta sonu ücretleri</b> her çalışanın kendi sayfasından ayrı girilir (Cumartesi, Pazar, tatil, yemek, ek saat).</li><li><b>Şirket</b> bölümü yalnızca yöneticilere görünür.</li><li>Başlıktaki “Görünüm” menüsünden bir usta başı veya işçinin ekranını önizleyebilirsiniz.</li></ol>')+
 sec(['yonetici'],'<h3>Maaş ve mesai nasıl hesaplanır? (yöneticiler için)</h3>'+
 '<h4>1 · Mesai</h4><ul><li><b>Cumartesi, Pazar ve resmi tatil:</b> o gün giriş-çıkışı onaylanan kişiye, kendi sayfasında yazan günlük ücret ödenir (ör. Cumartesi 5.000 ₺, Pazar 8.000 ₺). Yarım gün = yarı ücret.</li><li><b>Hafta içi ek saat:</b> çıkış saati mesai bitişinden ('+esc(S.ayar.bitis)+') sonraysa aradaki süre yarım saate aşağı yuvarlanır ve saat ücretiyle çarpılır. Saat ücreti girilmemişse Cumartesi ücreti ÷ '+nf(num(S.ayar.gunSaat,10.5))+' saat kullanılır. Usta başı veya yönetici onaylamayan ek saat ödenmez.</li><li><b>Yemek:</b> işaretlenen her gün için yemek ücreti eklenir.</li><li><b>Avans</b> mesai alacağından düşülür. Ödenmeyen tutar sonraki aya “önceki aylardan devreden” olarak geçer.</li><li>Formül: <b>Toplam alacak = önceki aylardan devreden mesai − önceki avans + bu ayın mesaisi − bu ayın avansı</b>.</li></ul>'+
 '<h4>2 · Maaş</h4><ul><li>Esas tutar SGK hizmet listesindeki <b>brüt</b> ücrettir. Ay her zaman <b>30 gün</b> sayılır (28, 29 veya 31 çeken aylar da 30).</li><li><b>Net (tahmini)</b> = brüt − SGK işçi payı %14 − işsizlik %1 − gelir vergisi (%15 dilim, asgari ücret istisnası düşülerek) − damga vergisi (‰7,59, asgari ücret kısmı istisna). Asgari ücretli için net 28.075,50 ₺’dir. Yıl içinde vergi dilimi yükseldikçe gerçek net düşer; <b>yatırılacak kesin tutar muhasebe bordrosudur</b>.</li><li>Ay ortasında işe giren veya ayrılan için gün = o aydaki takvim günü (en fazla 30).</li></ul>'+
 '<h4>3 · Eksik gelen kişi</h4><ul><li>Puantajdaki <b>ücretsiz izin (Üİ)</b>, <b>devamsız (D)</b> ve <b>rapor (R)</b> günleri SGK gününden düşülür. Yıllık izin ve mazeret izni ücretlidir, düşülmez. Sarı/mor yoklama kayıtları “Puantaja aktar” ile işlenince bu sayılar kendiliğinden oluşur.</li><li><b>Hak edilen maaş = aylık tutar × (SGK günü − eksik gün) ÷ 30</b>.</li><li>Örnek: net 28.075,50 ₺ alan işçi 2 gün devamsız → 28.075,50 × 28 ÷ 30 = <b>26.203,80 ₺</b>. 1 gün ücretsiz izin + 1 gün rapor da aynı sonucu verir.</li><li>Rapor günlerinde ücret yerine SGK geçici iş göremezlik ödeneği alınır (işveren ödemesi sözleşmeye bağlıdır). Devamsızlık olan haftada hafta tatili ücreti kesintisi gibi yasal ayrıntılar bordroda muhasebe tarafından yapılır.</li></ul>'+
 '<h4>4 · Ay sonu ödeme akışı</h4><ol><li><b>Ay sonu maaş</b> ekranı (Genel Müdür / maaş yatırma yetkilisi): kişi kişi hak edilen net maaş, mesai alacağı ve toplam ödeme görünür. Ödeme yapıldıkça Maaş ve Mesai tikleri atılır; toplu işaretleme de vardır.</li><li><b>Bordro kontrol</b> ekranı (Satış Planlama Yöneticisi / bordro yetkilisi): muhasebe bordrosundaki net tutar girilir, fark görülür; maaş, avans ve mesai ayrı ayrı işaretlenip <b>Onayla</b> denir. 1 ₺’den büyük farkta not zorunludur.</li><li>Her tik, onay ve geri alma “Yapılan işlemler”de tarih-saat ve kişi adıyla kayıtlıdır.</li></ol>'+
 '<h4>5 · Yöneticiler ve unvanlar</h4><p>Birden fazla yönetici tanımlanabilir; her birinin unvanı olur. “Sınırlı görünüm” yetkisi verilen yönetici (ör. Yüksek Mimar) usta başı gibi tüm ekipleri, günlük notları ve haftalık planları görür, duyuru yazabilir; giriş-çıkış, mesai, izin onayı veremez, ücret ve maaş ekranlarını göremez. Unvan, rol ve yetkileri yalnız <b>Genel Müdür</b> unvanındaki yöneticiler belirler (Yönetim → Roller ve ekipler). Yetkiler: Ay sonu maaş yatırma, Bordro kontrol ve onay, Yönetici ve unvan atama.</p>')+
 sec(['yonetici'],'<h3>Örnek senaryo — maaş ve mesai ödemesi (yöneticiler için)</h3><p>Özgür Akyol’un el notundaki 3 aylık mesaisi puantaja şöyle işlendi (Cumartesi 5.000 ₺, Pazar 8.000 ₺, yemek 2.500 ₺):</p><table class="t" style="max-width:640px"><thead><tr><th>Ay</th><th>Mesai</th><th class="n">Hak</th><th class="n">Avans</th><th class="n">Ay neti</th></tr></thead><tbody><tr><td>Ağustos</td><td>3 Cumartesi</td><td class="n">15.000 ₺</td><td></td><td class="n">15.000 ₺</td></tr><tr><td>Eylül</td><td>4 Cumartesi</td><td class="n">20.000 ₺</td><td></td><td class="n">20.000 ₺</td></tr><tr><td>Ekim</td><td>5 Cumartesi + 2 Pazar + 2 yemek</td><td class="n">46.000 ₺</td><td class="n neg">−29.000 ₺</td><td class="n">17.000 ₺</td></tr><tr><td colspan="4"><b>Toplam alacak</b></td><td class="n"><b>52.000 ₺</b></td></tr></tbody></table>'+
 '<ol><li><b>Hiç tik atılmamışsa</b> Kasım ekranında: “Önceki aylardan devreden mesai 81.000 ₺” ve “Önceki aylardan avans −29.000 ₺” sarı ⚠ satırları görünür; toplam alacak <b>52.000 ₺</b>.</li>'+
 '<li><b>Ekim’de Mesai tiki atılırsa</b> program ödenen tutarı sorar (öneri 52.000 ₺ = Ağustos + Eylül + Ekim). 52.000 ₺ girilirse Ekim satırında “Toplam alacak 52.000 · Ödendi 52.000 · Kalan 0” görünür; Ağustos ve Eylül “Ekim ödemesine dahil” olur. <b>Kasım sıfırdan başlar</b>, çünkü borç kalmamıştır. Hiçbir tutar Kasım’a sarkmaz.</li>'+
 '<li><b>Kısmi ödeme:</b> Ekim’de 40.000 ₺ ödendiyse tutar 40.000 girilir. Kalan 12.000 ₺, Kasım’da “Ekim ödemesinden kalan 12.000 ₺” olarak sarı ⚠ ile görünür ve Kasım’ın toplam alacağına eklenir.</li>'+
 '<li><b>Ödeme Kasım’da yapıldıysa</b> tik Kasım ayına atılır; o zaman Ağustos–Ekim “Kasım ödemesine dahil” görünür.</li>'+
 '<li><b>Maaş tiki</b> yalnızca o ayın SGK maaşının (bordro neti) yattığını kaydeder; mesai tutarlarını değiştirmez. Takip başlangıç ayından sonra tiklenmeyen maaşlar sonraki aylarda “… maaşı yatmadı” uyarısı verir.</li>'+
 '<li><b>Tiki kaldırmak</b> “Emin misiniz?” onayı ister; gerekçe yazılır. İşaret ve kaldırma işlemleri <b>Yapılan işlemler</b> sekmesinde tarih, saat ve kişi adıyla durur.</li></ol>')+
 '<h3>Duyurular</h3><p>Panel ve “Bugün” ekranının üstünde <b>Duyurular</b> bölümü vardır. Yöneticiler herkese ya da belirli bir usta başının ekibine, usta başları herkese ya da kendi ekiplerine duyuru yazar; işçiler okur. Önemli duyurular üstte sabitlenebilir, son gösterim tarihi verilebilir. Yeni duyuru gelince ekranda sarı bildirim çıkar.</p><h3>Karşılama alanı</h3><p>Ekranın üstünde tarih, hafta numarası, saat (saniye saniye), Kartal hava durumu ile TCMB döviz satış kurları ve gram altın görünür. Arka plan gökyüzü günün saatine göre değişir. Hava ve kur bilgisi günde birkaç kez otomatik güncellenir; son güncelleme saati kartın altında yazar.</p>'+
 '<h3>Gizlilik</h3><p class="small">İşçi ve usta başı ücret, puantaj tutarları ve şirket bilgilerini göremez. Ortak cihaz kullanıyorsanız işiniz bitince “Çıkış yap” düğmesine basın.</p></div>'};

ACT.gSave=async()=>{const G=S.gDraft;if(!G)return;const ym=ymOf(G.date),dd=G.date.slice(8);let n=0;const jobs=[];
 for(const[id,r]of Object.entries(G.rows)){if(JSON.stringify(r)===G.orig[id])continue;n++;const rec={...r};if(rec.ek==='')delete rec.ek;else rec.ek=+rec.ek;if(rec.d&&!rec.g&&(rec.d==='C'||rec.d==='Y')){rec.g=S.ayar.baslangic;rec.c=rec.c||S.ayar.bitis}jobs.push(saveMany(id,ym,{[dd]:rec}))}
 if(!n){toast('Değişiklik yok.');return}try{await Promise.all(jobs);toast(n+' kişinin kaydı kaydedildi ✓')}catch(e){}logEvt('Günlük kayıt','',dLabel(G.date)+' — '+n+' kişinin puantajı güncellendi');S.gDirty=false;S.gDraft=null;draw()};

 if(!d.del){rec={d:val('m-d'),g:val('m-g'),c:val('m-c'),daire:val('m-daire'),islem:val('m-islem'),a:val('m-a'),y:val('m-y')?1:0,src:old.src||''};const ek=val('m-ek');if(ek!=='')rec.ek=+ek;if(rec.d&&!['C','Y'].includes(rec.d)){delete rec.g;delete rec.c}}

 idsFor(a,b).forEach(id=>{for(let d=1;d<=dim(ym);d++){const ds=ym+'-'+pad(d);if(ds>lim)break;if(kindOf(ds)!=='hi'||!activeOn(id,ds)||getDay(id,ds))continue;(plan[id]=plan[id]||{})[pad(d)]={d:'C',g:S.ayar.baslangic,c:S.ayar.bitis};n++}});
 S._fill=plan;modal('<h3>Hafta içi boş günleri doldur</h3><p>'+ymLabel(ym)+' için '+(lim<b?trDate(lim)+' tarihine kadar ':'')+'kayıt girilmemiş <b>'+n+'</b> hafta içi gün “Çalıştı” ('+esc(S.ayar.baslangic)+'–'+esc(S.ayar.bitis)+') olarak işaretlenecek. Hafta sonları, tatiller ve mevcut kayıtlar değişmez.</p><div class="mfoot"><button class="btn" data-act="mClose">İptal</button><button class="btn p" data-act="fillGo" '+(n?'':'disabled')+'>Doldur</button></div>')};

 modal('<h3>'+esc(nameOf(d.id))+' · '+(k==='giris'?'Giriş':'Çıkış')+' — '+dLabel(d.ds)+'</h3><div class="fg"><label class="f">Saat<input id="q-s" type="time" value="'+def+'"></label>'+(k==='cikis'?'<label class="f">Blok / daire<select id="q-daire">'+daireOpts((yDay(d.id,d.ds)||{}).is&&yDay(d.id,d.ds).is.daire||'')+'</select></label><label class="f">Yapılan iş<select id="q-islem">'+islemOpts('')+'</select></label><label class="f wide">Açıklama<input id="q-a"></label>':'')+'</div><p class="note">'+(self?'Kayıt usta başınıza / yöneticinize sarı düşer.':'Sizin girdiğiniz kayıt onaylı (yeşil) sayılır.')+'</p><div class="mfoot"><button class="btn" data-act="mClose">İptal</button><button class="btn p" data-act="yQuickGo" data-id="'+esc(d.id)+'" data-ds="'+d.ds+'" data-k="'+k+'">Kaydet</button></div>')};

 await yUpd(d.id,d.ds,day=>{day[d.k]=newItem({saat:s},auto);if(is&&(is.daire||is.islem||is.a))day.is={...(day.is||{}),...clean(is)};if(d.k==='giris')delete day.gelmedi}).catch(()=>{});if(isY()&&needsTransfer(d.id,d.ds))await transfer([[d.id,d.ds]]);toast('Kaydedildi ✓');render()};

ACT.yEdit=d=>{const x=yDay(d.id,d.ds)||{};const ap=canApprove(d.id);const k=kindOf(d.ds);
 const ck=(id,on,l)=>ap?'<label class="cb small"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+'> '+l+'</label>':'';

ACT.yEditGo=async d=>{const ap=canApprove(d.id);const v={g:val('e-g'),c:val('e-c'),m:val('e-m'),ma:val('e-ma'),my:val('e-my'),go:val('e-go'),co:val('e-co'),mo:val('e-mo'),gel:val('e-gel'),is:clean({daire:val('e-daire'),islem:val('e-islem'),a:val('e-a')})};closeModal();
 await yUpd(d.id,d.ds,day=>{const part=(k,saat,ok,extra)=>{const cur=day[k];if(!saat&&!(extra&&Object.values(extra).some(Boolean))){delete day[k];return}
   const changed=!cur||cur.saat!==saat||JSON.stringify(extra||{})!==JSON.stringify({aciklama:cur.aciklama,yemek:cur.yemek});const it=changed?newItem({saat,...(extra||{})},false):clone(cur);
   if(ap){if(ok&&!it.onay)it.onay=stamp();if(!ok)delete it.onay}else if(changed)delete it.onay;day[k]=it};
  part('giris',v.g,v.go);part('cikis',v.c,v.co);if(v.m||v.ma||v.my)part('mesai',v.m===''?null:+v.m,v.mo,{aciklama:v.ma,yemek:!!v.my});else delete day.mesai;
  if(v.is)day.is=v.is;else delete day.is;if(ap){if(v.gel&&!day.gelmedi)day.gelmedi=stamp();if(!v.gel)delete day.gelmedi}}).catch(()=>{});

 else if(d.k==='son'){if(!doc.son.yapilan||!doc.son.ihtiyac){toast('“Tamamlanan işler” ve “Gelecek hafta için gerekenler” zorunlu','e');return}doc.son.durum='gonderildi';doc.son.ts=Date.now();doc.son.ad=actorName()}
 else{doc.bas.durum=cur.bas&&cur.bas.durum==='gonderildi'?'gonderildi':'taslak';doc.son.durum=cur.son&&cur.son.durum==='gonderildi'?'gonderildi':'taslak';if(cur.bas&&cur.bas.ts)doc.bas.ts=cur.bas.ts;if(cur.son&&cur.son.ts)doc.son.ts=cur.son.ts}
 S.plan[D.key]=doc;S.pDirty=false;await put('plan/'+D.key,doc).then(()=>toast(d.k==='taslak'?'Taslak kaydedildi':'Gönderildi ✓ Yöneticiye bildirildi')).catch(()=>{});draw()};

ACT.login=async()=>{const u=uKey(val('l-u')),p=val('l-p');if(!u||!p){toast('Kullanıcı adı ve şifre girin','e');return}
 if(!/^[a-z0-9._-]{2,40}$/.test(u)){toast('Kullanıcı adı veya şifre hatalı','e');return}
 if(window.__CF){let r;try{r=await window.__cf.login(u,p)}catch(e){toast(e&&e.code==='cok_deneme'?'Çok fazla hatalı deneme — 15 dakika sonra tekrar deneyin':e&&e.code==='pasif'?'Bu hesaba bağlı personel aktif değil':e&&e.code==='unavailable'?'Sunucuya ulaşılamadı':'Kullanıcı adı veya şifre hatalı','e');return}
  storeSession(r.session);window.__cf.resync();S.view=null;decideRole();draw();if(r.session.empId!=='__g'){for(let i=0;i<50&&!S.personel[r.session.empId];i++)await new Promise(z=>setTimeout(z,100))}toast(r.session.empId==='__g'?'Hoş geldiniz':'Hoş geldiniz, '+esc(firstName()||P(r.session.empId).ad||''));return}
 const a=await hesapGetir(u);
 if(!a||a.aktif===false||SHA.pw(p,a.salt)!==a.hash){toast('Kullanıcı adı veya şifre hatalı','e');return}
 if(a.rol==='g'){storeSession({u,empId:'__g',t:a.hash.slice(0,16)});S.view=null;decideRole();toast('Hoş geldiniz');draw();return}
 if(!S.personel[a.empId]||!isCurrent(a.empId)){toast('Bu hesaba bağlı personel aktif değil','e');return}
 storeSession({u,empId:a.empId,t:a.hash.slice(0,16)});S.view=null;decideRole();toast('Hoş geldiniz, '+esc(P(a.empId).ad||''));draw()};
ACT.logout=()=>{if(window.__CF){window.__cf.logout().catch(()=>{});setTimeout(()=>window.__cf.resync(),300)}storeSession(null);S.view=null;decideRole();draw()};
const trLow=x=>String(x||'').replace(/I/g,'ı').replace(/İ/g,'i').toLowerCase();
const uKey=x=>trLow(x).trim().replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[âàá]/g,'a').replace(/[îí]/g,'i').replace(/[ûú]/g,'u').replace(/\s+/g,'');
function genPw(){const c='23456789';let s='';const r=new Uint32Array(8);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach((x,i)=>r[i]=Math.random()*1e9);r.forEach(x=>s+=c[x%c.length]);return s}
function userName(id){const p=P(id);const base=trLow((p.ad||'').trim().charAt(0))+'.'+trLow(p.soyad||'x').replace(/\s+/g,'');let n=base,i=2;while(S.hesaplar[uKey(n)]||Object.values(S.personel).some(q=>q!==p&&q.kullanici&&uKey(q.kullanici)===uKey(n)))n=base+(i++);return n}

 const salt=rid()+rid();const doc={empId:d.id,kad:ad,salt,hash:SHA.pw(p,salt),aktif:true,olusturan:actorName(),ts:Date.now()};S.hesaplar[u]=doc;const pp=clone(P(d.id));pp.kullanici=ad;
 await Promise.all([put('hesaplar/'+u,doc),savePersonel(d.id,pp)]).catch(()=>{});logEvt('Kullanıcı hesabı',d.id,'“'+ad+'” kullanıcı adı açıldı');showPw(d.id,ad,p)};

 const key=d.id+'__'+d.ym;const doc=clone(S.odeme[key]||{});doc.empId=d.id;doc.ay=d.ym;

/* ================= Excel (xlsx) ================= */
const XL=(()=>{const enc=new TextEncoder();
 const T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
 const crc=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=T[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
 function zip(files){const parts=[],cen=[];let off=0;
  for(const f of files){const nm=enc.encode(f.name),d=enc.encode(f.data),c=crc(d);
   const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
   parts.push(new Uint8Array(h.buffer),nm,d);
   const z=new DataView(new ArrayBuffer(46));z.setUint32(0,0x02014b50,true);z.setUint16(4,20,true);z.setUint16(6,20,true);z.setUint16(8,0x0800,true);z.setUint16(14,0x21,true);z.setUint32(16,c,true);z.setUint32(20,d.length,true);z.setUint32(24,d.length,true);z.setUint16(28,nm.length,true);z.setUint32(42,off,true);
   cen.push(new Uint8Array(z.buffer),nm);off+=30+nm.length+d.length}
  const cs=cen.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)])}

 sortedIds().filter(id=>!P(id).arsiv&&P(id).cikis&&!isCurrent(id)).forEach(id=>{const p=P(id);rows.push([B_(nameOf(id)),{v:p.meslek||''},{v:trDate(p.giris),s:8},{v:trDate(p.cikis),s:8},{v:(CIKIS_KOD.find(x=>x[0]===p.cikisKod)||['',p.cikisKod||''])[1]},{v:p.cikisAciklama||''},{v:p.cikisYapan||''},{v:tsStr(p.cikisTs)}])});
 const r2=[['Ad soyad','Tarih','Neden','Açıklama','İşlemi yapan'].map(H_)];sortedIds().filter(id=>P(id).arsiv).forEach(id=>{const a=P(id).arsiv;r2.push([B_(nameOf(id)),{v:trDate(a.tarih),s:8},{v:a.neden||''},{v:a.aciklama||''},{v:a.yapan||''}])});

ACT.xlsYok=async()=>{const ym=ymOf(today());const rows=[['Personel','Usta başı','Tarih','Gün','Giriş','Giriş onayı','Çıkış','Çıkış onayı','Mesai (sa)','Mesai onayı','İzin','Gelmedi','Yapılan iş'].map(H_)];
 liveIds().forEach(id=>{for(let d=1;d<=dim(ym);d++){const ds=ym+'-'+pad(d);if(ds>today())break;const x=yDay(id,ds);if(!x)continue;const ok=it=>it?(it.onay?'✓ '+it.onay.ad:'bekliyor'):'';
  rows.push([B_(nameOf(id)),{v:P(id).ustabasi?nameOf(P(id).ustabasi):''},{v:trDate(ds),s:8},{v:GUNU[pd(ds).getDay()]},{v:x.giris&&x.giris.saat||'',s:x.giris?(x.giris.onay?12:5):8},{v:ok(x.giris)},{v:x.cikis&&x.cikis.saat||'',s:x.cikis?(x.cikis.onay?12:5):8},{v:ok(x.cikis)},{v:x.mesai?x.mesai.saat||'':'',s:8},{v:ok(x.mesai)},{v:x.izin?(IZIN[x.izin.tur]||'')+' ('+x.izin.durum+')':''},{v:x.gelmedi?'Gelmedi':'',s:x.gelmedi?13:0},{v:x.is?[daireLbl(x.is.daire),x.is.islem,x.is.a].filter(Boolean).join(' · '):''}])}});
 await saveFile('Yoklama_'+fnSafe(ymLabel(ym))+'.xlsx',XL.build([{name:'Yoklama '+AYLAR[+ym.slice(5)-1],rows,cols:[22,18,11,11,8,18,8,18,9,18,22,10,40],freeze:1}]))};

 Object.values(S.isler).sort((a,b)=>(a.blok||'').localeCompare(b.blok||'')||a.daire-b.daire).forEach(v=>rows.push([{v:v.blok},{v:+v.daire},{v:v.model||''},{v:v.kaplama||''},{v:v.tezgahM??''},{v:v.kaplamaM??''},{v:DS[v.durum||'bekliyor']}]));
 const n=rows.length;rows.push([{v:'TOPLAM',s:9},{v:'',s:9},{v:'',s:9},{v:'',s:9},{v:null,s:9,f:'SUM(E2:E'+n+')'},{v:null,s:9,f:'SUM(F2:F'+n+')'},{v:'',s:9}]);

 sh.unshift(shOzet(liveIds(),f+'-01',today(),'Genel Mesai Özeti (tüm dönem)'));await saveFile('Tum_Puantaj_'+today()+'.xlsx',XL.build(sh))};
const TAM_KOL=['personel','ucretler','kayitlar','hareketler','isler','yoklama','plan','talep','gunnot','duyuru','ayarlar','sirket','canli','hesaplar','odeme','islemlog','girisler'];
ACT.backupFull=async()=>{if(S.realRole!=='yonetici'){toast('Yalnız yönetici','e');return}const docs={};let n=0;toast('Yedek hazırlanıyor…');
 for(const c of TAM_KOL){try{const q=await S.db.collection(c).get();q.docs.forEach(d=>{docs[c+'/'+d.id]=d.data();n++})}catch(e){toast(c+' okunamadı ('+(e&&e.code)+')','e');return}}
 await saveFile('tas_isleri_TAM_yedek_'+today()+'.json',JSON.stringify({tur:'tas-isleri-tam-yedek',surum:1,olusturma:new Date().toISOString(),adet:n,docs}));toast(n+' kayıt yedeklendi ✓')};
ACT.restore=()=>modal('<h3>Tam yedekten geri yükle</h3><p>“Tam yedek” dosyasını seçin. Dosyadaki bölümlerin (personel, puantaj, ödemeler, hesaplar…) <b>mevcut kayıtları silinip</b> yedektekilerle değiştirilir.</p><input type="file" id="rs-f" accept=".json,application/json"><label class="f">Onay için <b>YÜKLE</b> yazın<input id="rs-ok" autocapitalize="characters"></label><div class="mfoot"><button class="btn" data-act="mClose">Vazgeç</button><button class="btn d" data-act="restoreGo">Geri yükle</button></div>');
ACT.restoreGo=async()=>{if(!window.__CF||S.gz)return;if(val('rs-ok').toUpperCase()!=='YÜKLE'&&val('rs-ok').toUpperCase()!=='YUKLE'){toast('Onay için YÜKLE yazın','e');return}const f=($('#rs-f').files||[])[0];if(!f){toast('Dosya seçin','e');return}
 let j;try{j=JSON.parse(await f.text())}catch(e){toast('Dosya okunamadı','e');return}if(!j||j.tur!=='tas-isleri-tam-yedek'||!j.docs){toast('Bu bir tam yedek dosyası değil','e');return}
 closeModal();toast('Yükleniyor…');try{const r=await window.__cf.importAll(j.docs);logEvt('Yedek',null,'Tam yedek geri yüklendi ('+r.adet+' kayıt, '+(j.olusturma||'').slice(0,10)+')');toast(r.adet+' kayıt yüklendi ✓');window.__cf.resync()}catch(e){toast('Yüklenemedi ('+(e&&e.code)+')','e')}};
ACT.canliNow=async()=>{try{await window.__cf.canli();toast('Güncellendi ✓');window.__cf.resync()}catch(e){toast('Güncellenemedi ('+(e&&e.code)+')','e')}};

const RO_A=['go','home','navT','pTab','mon','bDate','gDate','emp','empBack','hMod','pvOff','logout','mClose','eye','duyAll','ytab','monGo','pWeek','planGo','xlsTop','xlsKisi','xlsPers','xlsAyr','xlsYok','xlsIsler','xlsAll','xlsLog','xlsMaas','backup','backupFull','showClaim','copyPw'],RO_C=['showOld','bDate','gDate','hFrom','hTo','preview','pUsta','logF','maasY'];function roBlock(){toast('Görüntüleme modu: değişiklik yapılamaz','y');if($('#modal').classList.contains('hidden'))draw();else closeModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='TR'&&e.target.closest('input,select,label,textarea'))return;if(S.gz&&!RO_A.includes(b.dataset.act)){e.preventDefault();roBlock();return}const f=ACT[b.dataset.act];if(f){e.preventDefault();try{f(b.dataset,b,e)}catch(err){console.error(err);toast('Hata: '+esc(err.message),'e')}}});
document.addEventListener('change',e=>{const b=e.target.closest('[data-chg]');if(!b)return;if(S.gz&&!RO_C.includes(b.dataset.chg)){roBlock();return}const f=CHG[b.dataset.chg];if(f)f(b.dataset,b,e)});
document.addEventListener('input',e=>{const b=e.target.closest('[data-inp]');if(!b)return;const f=INP[b.dataset.inp];if(f)f(b.dataset,b,e)});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.deferred&&!isEditing()&&$('#modal').classList.contains('hidden'))draw()},60));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').classList.contains('hidden'))closeModal();if(e.key==='Enter'&&e.target.id==='l-p')ACT.login()});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(visibleTabs().includes(v)&&v!==S.view){S.view=v;draw()}});
setInterval(()=>{if(S.role&&(S.view==='panel'||S.view==='bugun'))render()},60000);
boot().catch(e=>{console.error(e);fatal('Başlatılamadı: '+(e&&e.message||e))});
